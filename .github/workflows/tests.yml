name: Automation suite

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      AUTOMATION_ENVIRONMENT: ci
      AUTOMATION_FRONTEND_URL: http://127.0.0.1:5173
      AUTOMATION_API_URL: http://127.0.0.1:4002/api
      AUTOMATION_BROWSER: chromium
      AUTOMATION_HEADLESS: "true"
      AUTOMATION_ARTIFACTS_DIR: artifacts

    steps:
      - name: Check out automation
        uses: actions/checkout@v4

      - name: Check out backend
        uses: actions/checkout@v4
        with:
          repository: ArmanIvanyan05/social-network-advanced-backend
          path: backend

      - name: Check out frontend
        uses: actions/checkout@v4
        with:
          repository: ArmanIvanyan05/social-app
          path: frontend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Generate ephemeral backend signing key
        shell: bash
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Install and start backend
        working-directory: backend
        env:
          PORT: "4002"
          FRONTEND_ORIGIN: http://127.0.0.1:5173
          MONGO_HOST: 127.0.0.1
          MONGO_PORT: "27017"
          MONGO_DATABASE: social_network_ci_test
          MONGO_TEST_DATABASE: social_network_ci_test
          NODE_ENV: test
        shell: bash
        run: |
          npm ci
          npm run check
          nohup npm start > ../backend.log 2>&1 &

      - name: Install and start frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://127.0.0.1:4002/api
        shell: bash
        run: |
          npm ci
          nohup npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > ../frontend.log 2>&1 &

      - name: Wait for systems under test
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4002/api/health | grep -q '"database":"connected"'; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              cat backend.log
              exit 1
            fi
            sleep 1
          done
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              cat frontend.log
              exit 1
            fi
            sleep 1
          done

      - name: Install automation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Run static quality gates
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy
          python -m pytest --collect-only -q

      - name: Run API suite
        shell: bash
        run: set -o pipefail; python -m pytest tests/api -v --alluredir=allure-results | tee pytest-api.log

      - name: Run smoke suite
        shell: bash
        run: set -o pipefail; python -m pytest tests/smoke -v --alluredir=allure-results | tee pytest-smoke.log

      - name: Run selected Chromium UI and E2E coverage
        shell: bash
        run: |
          set -o pipefail
          python -m pytest \
            tests/ui/test_auth_ui.py -m smoke \
            tests/e2e/test_vertical_slice.py \
            -v --alluredir=allure-results | tee pytest-ui-e2e.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-diagnostics
          if-no-files-found: warn
          path: |
            allure-results/
            artifacts/
            pytest-*.log
            backend.log
            frontend.log
