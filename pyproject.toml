[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "social-network-test-automation"
version = "0.1.0"
description = "Python test automation framework for the social network application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "allure-pytest>=2.13.5,<3",
  "faker>=26,<40",
  "httpx>=0.27,<1",
  "playwright>=1.46,<2",
  "pydantic-settings>=2.4,<3",
  "pytest>=8.3,<9",
  "pytest-xdist>=3.6,<4",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pre-commit>=3.8,<5",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/social_network_automation"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "smoke: critical SUT availability checks",
  "regression: broader regression coverage",
  "api: direct HTTP API coverage",
  "ui: browser-based UI coverage",
  "e2e: cross-layer end-to-end coverage",
  "auth: authentication and authorization coverage",
  "database: direct database validation",
  "serial: tests that must not execute concurrently",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ANN", "ASYNC", "B", "D", "E4", "E7", "E9", "F", "I", "LOG", "PT", "RUF", "SIM", "UP"]
ignore = [
  "ANN401",
  "COM812",
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "conftest.py"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["allure.*"]
ignore_missing_imports = true
